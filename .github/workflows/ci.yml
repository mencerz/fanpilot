name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Build
        run: swift build -v

      - name: Test
        run: swift test

      - name: Assemble app bundle
        run: zsh scripts/build-app.sh

      - name: Upload unsigned build
        uses: actions/upload-artifact@v4
        with:
          name: FanPilot-unsigned
          path: dist/FanPilot.app
          if-no-files-found: error
