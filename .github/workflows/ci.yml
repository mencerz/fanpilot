name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Build
        run: swift build -v

      - name: Test
        run: swift test

      - name: Assemble app bundle
        run: zsh scripts/build-app.sh

      # upload-artifact does not preserve the executable bit, which would make
      # the downloaded bundle unlaunchable; ditto keeps the bundle intact.
      - name: Package
        run: ditto -c -k --keepParent dist/FanPilot.app FanPilot.zip

      - name: Upload unsigned build
        uses: actions/upload-artifact@v4
        with:
          name: FanPilot-unsigned
          path: FanPilot.zip
          if-no-files-found: error
